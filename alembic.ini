# Alembic configuration for the BMTC Future Transit Planner.
#
# The database URL is NOT stored here. migrations/env.py reads it from the same settings the server
# uses (DATABASE_URL in the environment or .env, otherwise data/planner.db), so one value controls both.

[alembic]
# Path to the migration scripts. %(here)s is the folder that contains this file.
script_location = %(here)s/migrations

# Migration file names: 0001_baseline.py, 0002_<slug>.py, and so on.
# file_template = %%(rev)s_%%(slug)s

# Keep the default, which is the version folder inside script_location.
# version_locations = %(here)s/migrations/versions

# Used when rendering dates in new migration files. Blank means local time.
# timezone =

# Logging for the alembic command only. The server never reads this section.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
