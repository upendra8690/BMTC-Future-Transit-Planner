# Render Blueprint for the separate 4.0 service ONLY. It deploys branch v4 as a NEW service named
# bengaluru-transit-planner-v4. The live 3.0 service (bmtc-future-transit-planner-3-0, branch main) is not described
# here, so creating or syncing this Blueprint cannot change it.
#
# Create it once in the Render dashboard (full steps: docs/launch/DEPLOYMENT_GUIDE.md):
#   New -> Blueprint -> repository upendra8690/BMTC-Future-Transit-Planner-3.0 -> branch v4 -> Apply.
# Then check it with: python scripts/verify_deployment.py https://<its address> --v3 <the 3.0 address>
#
# ADMIN_API_KEY is generated by Render and never stored in Git. The free disk is empty after each restart, so the
# SYNTHETIC demo feed is loaded on start; it is demonstration data, never official BMTC or BMRCL data.
services:
  - type: web
    name: bengaluru-transit-planner-v4
    runtime: docker
    repo: https://github.com/upendra8690/BMTC-Future-Transit-Planner-3.0
    branch: v4
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SEED_DEMO_FEED
        value: "1"
