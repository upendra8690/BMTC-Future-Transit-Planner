# Render Blueprint for the separate 4.0 service ONLY: bengaluru-transit-planner-v4, built from branch v4. The live 3.0
# service (bmtc-future-transit-planner-3-0, branch main) is not described here, so applying or syncing this Blueprint
# cannot change it. Steps: docs/launch/DEPLOYMENT_GUIDE.md. Check a deployment with scripts/verify_deployment.py.
#
# The public service shows REAL information only (DEMO_MODE=0): the community Namma Metro timetable (unofficial,
# ODbL, labelled), official links and the upcoming-transport register. Invented demo data is never served here; run a
# demonstration server with DEMO_MODE=1 instead (locally, or as a separate service if the owner creates one).
# ADMIN_API_KEY is generated by Render and never stored in Git. The free disk is erased on every restart.
services:
  - type: web
    name: bengaluru-transit-planner-v4
    runtime: docker
    repo: https://github.com/upendra8690/BMTC-Future-Transit-Planner-3.0
    branch: v4
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "0"
      - key: LOAD_COMMUNITY_METRO
        value: "1"
