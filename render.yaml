# Render Blueprint for the 4.0 STAGING service only. It deploys branch v4 as a new, separate service; the live 3.0
# service is not managed by this file and is not changed by it.
# Create it in the Render dashboard: New -> Blueprint -> this repository -> branch v4.
# ADMIN_API_KEY is generated by Render (never stored in Git). The free disk is empty after each restart, so the
# SYNTHETIC demo feed is loaded on start; it is demonstration data, never official BMTC or BMRCL data.
services:
  - type: web
    name: bengaluru-transit-planner-4-staging
    runtime: docker
    branch: v4
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SEED_DEMO_FEED
        value: "1"
