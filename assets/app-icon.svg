<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- BMTC Planner app icon (original artwork, not an operator logo).
       A bus front over a route line whose three stops use the planner's classification colours:
       green = official verified, amber = unverified feed, violet = estimated scenario. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1033" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>

  <g id="foreground">
    <!-- route line with three stops -->
    <path d="M250 812 C 380 760, 470 870, 560 812 S 720 760, 776 800" fill="none" stroke="#ffffff" stroke-opacity="0.9"
          stroke-width="22" stroke-linecap="round"/>
    <circle cx="262" cy="806" r="34" fill="#22c55e" stroke="#ffffff" stroke-width="14"/>
    <circle cx="512" cy="826" r="34" fill="#f59e0b" stroke="#ffffff" stroke-width="14"/>
    <circle cx="764" cy="794" r="34" fill="#a855f7" stroke="#ffffff" stroke-width="14"/>

    <!-- bus front -->
    <g filter="url(#shadow)">
      <rect x="402" y="664" width="64" height="74" rx="18" fill="#0f172a"/>
      <rect x="558" y="664" width="64" height="74" rx="18" fill="#0f172a"/>
      <rect x="322" y="200" width="380" height="490" rx="74" fill="#ffffff"/>
    </g>
    <!-- mirrors -->
    <path d="M322 300 h-34 a14 14 0 0 0 -14 14 v58" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M702 300 h34 a14 14 0 0 1 14 14 v58" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <!-- destination sign -->
    <rect x="384" y="232" width="256" height="46" rx="14" fill="#f59e0b"/>
    <rect x="410" y="248" width="120" height="14" rx="7" fill="#7c2d12" opacity="0.55"/>
    <rect x="544" y="248" width="70" height="14" rx="7" fill="#7c2d12" opacity="0.55"/>
    <!-- windscreen -->
    <rect x="356" y="300" width="312" height="200" rx="34" fill="url(#glass)"/>
    <path d="M384 470 L520 322" stroke="#ffffff" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
    <path d="M446 476 L548 366" stroke="#ffffff" stroke-opacity="0.12" stroke-width="14" stroke-linecap="round"/>
    <!-- grille and lights -->
    <rect x="452" y="560" width="120" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="452" y="592" width="120" height="16" rx="8" fill="#cbd5e1"/>
    <circle cx="404" cy="584" r="34" fill="#fde68a" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="620" cy="584" r="34" fill="#fde68a" stroke="#f59e0b" stroke-width="8"/>
    <rect x="346" y="644" width="332" height="14" rx="7" fill="#e2e8f0"/>
  </g>
</svg>
