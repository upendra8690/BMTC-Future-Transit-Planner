<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">BMTC Future Transit Planner</title>
  <desc id="d">Bengaluru bus timetables and future scenarios for 2027 to 2030, with official, unverified and estimated data kept apart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="970" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <style>
      .h { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .s { font: 400 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb0c3; }
      .p { font: 600 17px 'Segoe UI', Helvetica, Arial, sans-serif; }
      .y { font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb0c3; }
      .dash { stroke-dasharray: 14 10; animation: move 1.6s linear infinite; }
      @keyframes move { to { stroke-dashoffset: -24; } }
      .bus { animation: drive 9s ease-in-out infinite; }
      @keyframes drive { 0% { transform: translateX(0); } 50% { transform: translateX(780px); } 100% { transform: translateX(0); } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <text x="70" y="104" class="h">BMTC Future Transit Planner</text>
  <text x="72" y="148" class="s">Plan Bengaluru bus services for 2027 – 2030, honestly.</text>

  <!-- classification pills -->
  <g transform="translate(72,178)">
    <rect width="190" height="38" rx="19" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80"/>
    <text x="95" y="25" text-anchor="middle" class="p" fill="#4ade80">Official verified</text>
    <rect x="206" width="190" height="38" rx="19" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24"/>
    <text x="301" y="25" text-anchor="middle" class="p" fill="#fbbf24">Unverified feed</text>
    <rect x="412" width="206" height="38" rx="19" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc"/>
    <text x="515" y="25" text-anchor="middle" class="p" fill="#c084fc">Estimated scenario</text>
  </g>

  <!-- route line with stops -->
  <line x1="90" y1="290" x2="970" y2="290" stroke="url(#route)" stroke-width="6" stroke-linecap="round" class="dash"/>
  <g fill="#0d1117" stroke-width="5">
    <circle cx="140" cy="290" r="11" stroke="#4ade80"/>
    <circle cx="400" cy="290" r="11" stroke="#a3d65a"/>
    <circle cx="660" cy="290" r="11" stroke="#f5b93a"/>
    <circle cx="920" cy="290" r="11" stroke="#c084fc"/>
  </g>
  <g class="y" text-anchor="middle">
    <text x="140" y="330">2027</text>
    <text x="400" y="330">2028</text>
    <text x="660" y="330">2029</text>
    <text x="920" y="330">2030</text>
  </g>

  <!-- bus -->
  <g class="bus">
    <g transform="translate(110,250)">
      <rect width="62" height="30" rx="7" fill="#60a5fa"/>
      <rect x="6" y="6" width="12" height="10" rx="2" fill="#0d1117"/>
      <rect x="22" y="6" width="12" height="10" rx="2" fill="#0d1117"/>
      <rect x="38" y="6" width="12" height="10" rx="2" fill="#0d1117"/>
      <circle cx="15" cy="31" r="5" fill="#f0f6fc"/>
      <circle cx="47" cy="31" r="5" fill="#f0f6fc"/>
    </g>
  </g>

  <!-- side stats -->
  <g transform="translate(870,70)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="260" height="150" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#30363d"/>
    <text x="24" y="44" font-size="30" font-weight="700" fill="#f0f6fc">159 tests</text>
    <text x="24" y="70" font-size="15" fill="#9fb0c3">all passing on Linux</text>
    <text x="24" y="110" font-size="30" font-weight="700" fill="#f0f6fc">35 API ops</text>
    <text x="24" y="134" font-size="15" fill="#9fb0c3">FastAPI · OpenAPI docs</text>
  </g>
</svg>
