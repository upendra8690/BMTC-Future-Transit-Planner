name: CI

on:
  push:
    branches: [main, v4]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Database migrations and check
        run: |
          cp .env.example .env
          python scripts/migrate_database.py
          python scripts/check_database.py
      - name: Tests
        run: python -m pytest -p no:cacheprovider

  container:
    name: Container image builds and serves the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t bengaluru-transit-planner:ci .
      # PORT=10000 is what Render sets for a web service; the app must listen on it.
      - name: Start a demonstration container (DEMO_MODE=1) on Render's port
        run: docker run -d --name planner -p 8000:10000 -e PORT=10000 -e DEMO_MODE=1 bengaluru-transit-planner:ci
      - name: Demonstration mode - health, version, page, upcoming transport, a demo journey, a refused payment, CSP
        run: |
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/api/features | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['version']; assert v.startswith('4.') and d['demo_mode'] is True, d; print('version', v)"
          curl -sf http://127.0.0.1:8000/ | grep -q "<title>Bengaluru Transit Planner</title>"
          curl -sf http://127.0.0.1:8000/api/upcoming | python3 -c "import json,sys; p=json.load(sys.stdin)['projects']; assert p and all(x['in_planner'] is False for x in p), p; print(len(p), 'upcoming entries')"
          curl -sf http://127.0.0.1:8000/api/data-status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['demo_mode'] and not d['realtime'], d; print(len(d['feeds']), 'feeds')"
          curl -sf "http://127.0.0.1:8000/api/plan?origin=Demo%20Lake%20View&destination=Demo%20Metro%20Hub&classification=UNVERIFIED_FEED&date=2027-01-04" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['options'] and d['realtime'] is False, d; print(len(d['options']), 'demo journey options')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/integrations/payments/request)" = "503"
          curl -sI http://127.0.0.1:8000/ | grep -i "content-security-policy"
      - name: Start a real-mode container (the public default) on another port
        run: docker run -d --name real -p 8001:10000 -e PORT=10000 bengaluru-transit-planner:ci
      - name: Real mode - no invented data; the community Metro timetable plans a journey with approximate times
        run: |
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8001/api/health > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8001/api/data-status | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['demo_mode'] is False and not any(f['demo'] for f in d['feeds']) and any(f['kind'] == 'COMMUNITY' for f in d['feeds']), d; print([f['source'] for f in d['feeds']])"
          curl -sf "http://127.0.0.1:8001/api/plan?origin=Demo%20Lake%20View&destination=Demo%20Metro%20Hub&classification=UNVERIFIED_FEED" | python3 -c "import json,sys; d=json.load(sys.stdin); assert not d['options'], d; print('demo stops not served')"
          curl -sf "http://127.0.0.1:8001/api/plan?origin=Indiranagar&destination=Jayanagar&classification=UNVERIFIED_FEED&modes=metro&date=2026-12-01" | python3 -c "import json,sys; d=json.load(sys.stdin); o=d['options'][0]; r=[l for l in o['legs'] if l['type']=='ride']; assert r[-1]['to']['name']=='Jayanagar' and all(l['timing']=='approximate' for l in r) and o['fare']['code'] in ('NOT_VERIFIED','CHANGES_NOT_PRICED'), o; print([l['route_number'] for l in r])"
          curl -sf "http://127.0.0.1:8001/api/plan?origin=Indiranagar&destination=Jayanagar&modes=metro&date=2026-12-01" | python3 -c "import json,sys; d=json.load(sys.stdin); assert not d['options'], d; print('officially verified: none, as expected')"
      - name: Container logs
        if: always()
        run: |
          docker logs planner
          docker logs real

  postgres:
    name: PostgreSQL - migrations, real data, searches and persistence across a restart
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # A throwaway database that exists only for this job; the address uses the postgresql:// form hosts give out.
      DATABASE_URL: postgresql://planner:ci-only-throwaway@localhost:5432/planner
      ADMIN_API_KEY: ci-only-throwaway-admin-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Migrations (twice, to show the second run changes nothing) and the database check
        run: |
          python scripts/migrate_database.py
          python scripts/migrate_database.py
          python scripts/check_database.py
      - name: Import the community Namma Metro timetable (twice; the second run must do nothing)
        run: |
          python scripts/load_community_metro.py
          python scripts/load_community_metro.py | grep "already imported"
      - name: Data survives a restart; real Metro searches and journeys work on PostgreSQL
        run: python scripts/check_persistence.py --include-admin-change
      - name: Real-mode server on PostgreSQL passes the deployment checks (except HTTPS, which needs a public host)
        run: |
          RATE_LIMIT_PER_MINUTE=100000 python -m uvicorn app.main:create_app --factory --app-dir backend --port 8000 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 2; done
          python scripts/verify_deployment.py http://127.0.0.1:8000 | tee verify.txt
          test "$(grep -c '^FAIL' verify.txt)" = "2"
          grep -q "FAIL 4.0 address uses HTTPS" verify.txt
          grep -q "FAIL 4.0 sends HSTS" verify.txt
