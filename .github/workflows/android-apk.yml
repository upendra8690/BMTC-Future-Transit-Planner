name: Android APK

# Builds the Flutter WebView wrapper in android/flutter_app.
#   main -> the released app (opens the live 3.x site), published on the "app-latest" release. Unchanged.
#   v4   -> a push is a COMPILE CHECK ONLY: the shell is analysed and built, then thrown away. Nothing is published
#           and no APK file is kept, whatever the repository variables say.
#           The "app-v4-preview" pre-release is published only by a manual run (Actions -> Android APK -> Run
#           workflow -> branch v4) with "publish_v4_preview" ticked AND the variable V4_PLANNER_URL set to the
#           deployed 4.0 site. A push can never publish it.
on:
  push:
    branches: [main, v4]
    paths:
      - "android/**"
      - "dashboard/icons/**"
      - "assets/app-icon.svg"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish_v4_preview:
        description: "v4 only: publish the app-v4-preview pre-release (also needs the V4_PLANNER_URL variable)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  IS_V4: ${{ github.ref_name == 'v4' }}
  # A v4 compile check without V4_PLANNER_URL uses a reserved, unreachable address; that APK is never kept.
  PLANNER_URL: ${{ github.ref_name == 'v4' && (vars.V4_PLANNER_URL || 'https://example.invalid/') || 'https://bmtc-future-transit-planner-3-0.onrender.com/' }}
  APP_LABEL: ${{ github.ref_name == 'v4' && 'Bengaluru Transit' || 'BMTC Planner' }}
  RELEASE_TAG: ${{ github.ref_name == 'v4' && 'app-v4-preview' || 'app-latest' }}
  # 'true' only for main, or for a manual v4 run that asked to publish and has a deployed 4.0 address.
  PUBLISH: ${{ github.ref_name == 'main' || (github.ref_name == 'v4' && github.event_name == 'workflow_dispatch' && inputs.publish_v4_preview && vars.V4_PLANNER_URL != '') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep Gradle's downloads between runs, so builds fetch less from Maven Central (which rate-limits CI runners).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/flutter_app/pubspec.yaml', '.github/workflows/android-apk.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create the native Android project around the starter
        run: |
          flutter create --platforms=android --project-name bmtc_planner_app --org io.github.upendra8690 .
          rm -rf test
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$manifest"
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APP_LABEL\"|" "$manifest"
          grep -n 'INTERNET\|android:label' "$manifest"

      - name: App icon and launch screen (assets/app-icon.svg, rendered into assets/icon/)
        run: |
          flutter pub add --dev flutter_launcher_icons flutter_native_splash
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "assets/icon/background.png"
            adaptive_icon_foreground: "assets/icon/foreground.png"
          EOF
          cat > flutter_native_splash.yaml <<'EOF'
          flutter_native_splash:
            color: "#0b47a8"
            image: assets/icon/foreground.png
            android_12:
              color: "#0b47a8"
              image: assets/icon/foreground.png
            ios: false
            web: false
          EOF
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3; do
            if flutter build apk --release --dart-define=PLANNER_URL="$PLANNER_URL" 2>&1 | tee build.log; then ok=1; break; fi
            # Retry only when a download was rate-limited or failed; real build errors fail straight away.
            grep -qE '429|Too Many Requests|Could not GET|Could not resolve' build.log || break
            echo "Download problem on attempt $attempt; waiting before retrying"; sleep $((attempt * 90))
          done
          if [ "$ok" != 1 ]; then
            # Surface the end of the log as an annotation, which is readable without signing in.
            tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=APK build log tail::/'
            echo
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/BMTC-Planner.apk"
          ls -la "$GITHUB_WORKSPACE/BMTC-Planner.apk"

      - name: Record what this run did
        run: |
          if [ "$PUBLISH" = "true" ]; then echo "APK built and published as $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else echo "Compile check only: the APK built successfully and was NOT published or kept." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: BMTC-Planner-apk
          path: BMTC-Planner.apk

      - name: Publish the APK (app-latest for main, app-v4-preview pre-release for v4)
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.IS_V4 == 'true' && '🧪 Bengaluru Transit Planner 4.0 — preview APK (not the stable app)' || '📱 BMTC Planner — Android app (latest)' }}
          prerelease: ${{ env.IS_V4 == 'true' }}
          make_latest: ${{ env.IS_V4 != 'true' }}
          files: BMTC-Planner.apk
          body: |
            **Download `BMTC-Planner.apk` below and open it on your Android phone.**

            Android will ask you to allow installs from your browser or file manager the first time. That is normal for apps outside the Play Store.

            The app opens the live planner at ${{ env.PLANNER_URL }}
            - The free server sleeps when idle, so the first load can take up to a minute.
            - Signed with a debug key, built automatically by GitHub Actions from commit ${{ github.sha }}.
            - Unofficial project. Not affiliated with BMTC, BMRCL or Namma Metro. The demo shows invented data.

            Prefer no download? Open the link in Chrome and choose **Install app** / **Add to Home screen**.
