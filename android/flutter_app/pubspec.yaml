# Starter project for the Android wrapper. NOT COMPILED in the build environment (no Flutter SDK was available).
# See android/README.md for the steps to create the native Android folder and build on a developer machine.
name: bmtc_planner_app
description: Android WebView wrapper for the Bengaluru Transit Planner web app (unofficial).
publish_to: "none"
version: 0.1.0+1

environment:
  # Dart 3.5 / Flutter 3.24 or newer: PopScope.onPopInvokedWithResult handles the back button.
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.0.0
  # Opens phone (tel:) and official-site links outside the WebView.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
