# Android wrapper for the Bengaluru Transit Planner web app. Built and analysed by the GitHub "Android APK" workflow;
# this machine has no Flutter SDK. See android/README.md for building it on a developer machine.
name: bmtc_planner_app
description: Android WebView wrapper for the Bengaluru Transit Planner web app (unofficial).
publish_to: "none"
# The build number is replaced by the workflow run number (--build-number), so every build has a higher version code.
version: 0.2.0+1

environment:
  # Dart 3.5 / Flutter 3.24 or newer: PopScope.onPopInvokedWithResult handles the back button.
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.0.0
  # Android-specific WebView settings: the location prompt for "Stops near me".
  webview_flutter_android: ">=3.16.0 <5.0.0"
  # Opens phone (tel:) and official-site links outside the WebView.
  url_launcher: ^6.3.0
  # Asks Android for location only when the planner page asks for it.
  permission_handler: ">=11.3.0 <13.0.0"
  # Downloads: a temporary file handed to Android's share sheet.
  path_provider: ^2.1.0
  share_plus: ">=10.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
